<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <title>Intro SE331</title>
        <!-- Import Styles -->
        <link rel="stylesheet" href="./assets/styles.css" />
        <!-- Import Vue.js -->
        <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    </head>

    <body>
        <div id="app">
            <div class="nav-bar"></div>
            <div class="cart">
                <p>Cart({{ cart }})</p>
            </div>
            <div class="product-display">
                <div class="product-container">
                    <div class="product-image">
                        <img :src="image" />
                    </div>

                </div>

            </div>
            <div class="product-info">
                <h1>
                    <a :href="link" target="_blank">
                        {{ product }}
                    </a>
                </h1>
                <p v-if="OnSale">On Sale!</p>
                <p v-else>Not on Sale</p>

                <p v-if="inventory > 10">In Stock</p>
                <p v-else-if="inventory <= 10 && inventory > 0">Almost out
                    of Stock</p>
                <p v-else>Out of Stock</p>

                <ul>
                    <li v-for="detail in details">{{ detail }}</li>
                </ul>
                <span v-for="s in size" :key="s" style="margin-right: 8px;">
                    {{ s }}
                </span>
                <div v-for="variant in variants" :key="variant.id "
                    @mouseover="updateImage(variant.image)" class="color-circle"
                    :style="{ backgroundColor: variant.color }">
                </div>
                <button :disabled="!inStock" @click="addToCart" :class="{ disabledButton: !inStock }">
                    Add to Cart
                </button>
                <button @click="updateinSale">
                    Update Sale Status
                </button>
            </div>
        </div>
        <!-- Import Js -->
        <script src="./main.js"></script>
    </body>

</html>
